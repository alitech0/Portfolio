{% from "_macros.html" import ico, soc with context %}
<div class="carousel">
    <div class="carousel-track" tabindex="0" aria-label="Projects, scroll sideways">
        {% for p in projects %}
        <article class="slide">
            <div class="slide-media">
                <img src="{{ p.image }}" alt="" loading="lazy" onerror="this.remove()">
            </div>
            <div class="slide-body">
                <h3>{{ p.title }}</h3>
                <p>{{ p.summary }}</p>
                {% if full %}<p class="detail">{{ p.details }}</p>{% endif %}
                <ul class="stack">{% for t in p.stack %}<li>{{ ico(t) }}{{ t }}</li>{% endfor %}</ul>
                {% if profile.github %}<a class="text-link repo" href="{{ profile.github }}" target="_blank" rel="noopener">View on GitHub</a>{% endif %}
            </div>
        </article>
        {% endfor %}
    </div>
    <div class="carousel-nav">
        <button class="icon-btn car-prev" aria-label="Previous project">&larr;</button>
        <button class="icon-btn car-next" aria-label="Next project">&rarr;</button>
    </div>
</div>
